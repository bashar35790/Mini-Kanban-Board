services:
  postgres:
    image: postgres:16-alpine
    container_name: kanban-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kanban

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kanban"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: kanban-backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/kanban?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/kanban?schema=public
      BETTER_AUTH_SECRET: local-dev-secret-minimum-32-chars-here
      BETTER_AUTH_URL: http://localhost:5000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:3000
      PORT: 5000

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./backend:/app
      - /app/node_modules

    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: kanban-frontend
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000

    # depends_on:
    #   - backend

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    command: npm run dev

volumes:
  postgres_data: